<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">先模擬，再回到真人驗證</title><desc id="desc">以真人資料建立模擬，設定情境方案，與真人觀察比較並更新。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e35"/></marker></defs>
<rect width="1440" height="810" rx="0" fill="#f3f1e9"/>
<g font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><text font-family="'Songti TC','Noto Serif TC',serif" x="70" y="92" fill="#20352c" font-size="54" font-weight="750" text-anchor="start">先模擬，再回到真人驗證</text><text x="70" y="148" fill="#626a5f" font-size="30" font-weight="500" text-anchor="start">人類行為研究的概念流程</text><rect x="62" y="248" width="302" height="238" rx="2" fill="#fcfaf4" stroke="#d5d7c9" stroke-width="2"/><text x="213" y="342" fill="#20352c" font-size="32" font-weight="700" text-anchor="middle">真人資料</text><text x="213" y="408" fill="#626a5f" font-size="27" font-weight="500" text-anchor="middle">訪談與行為</text><path d="M 371 367 H 390" fill="none" stroke="#526e35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="400" y="248" width="302" height="238" rx="2" fill="#fcfaf4" stroke="#d5d7c9" stroke-width="2"/><text x="551" y="342" fill="#20352c" font-size="32" font-weight="700" text-anchor="middle">個體與群體模擬</text><text x="551" y="408" fill="#626a5f" font-size="27" font-weight="500" text-anchor="middle">保留差異</text><path d="M 709 367 H 728" fill="none" stroke="#526e35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="738" y="248" width="302" height="238" rx="2" fill="#fcfaf4" stroke="#d5d7c9" stroke-width="2"/><text x="889" y="342" fill="#20352c" font-size="32" font-weight="700" text-anchor="middle">情境與方案</text><text x="889" y="408" fill="#626a5f" font-size="27" font-weight="500" text-anchor="middle">人、環境、選項</text><path d="M 1047 367 H 1066" fill="none" stroke="#526e35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1076" y="248" width="302" height="238" rx="2" fill="#e3e8d7" stroke="#d5d7c9" stroke-width="2"/><text x="1227" y="342" fill="#20352c" font-size="32" font-weight="700" text-anchor="middle">真人驗證</text><text x="1227" y="408" fill="#626a5f" font-size="27" font-weight="500" text-anchor="middle">比較預測與觀察</text><path d="M 1227 510 V 608 H 213 V 515" fill="none" stroke="#526e35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="495" y="568" width="450" height="78" rx="2" fill="#f3f1e9" stroke="#f3f1e9" stroke-width="2"/><text x="720" y="618" fill="#526e35" font-size="32" font-weight="700" text-anchor="middle">更新資料與問題</text><text x="720" y="744" fill="#626a5f" font-size="26" font-weight="500" text-anchor="middle">概念歸納，非未公開產品架構</text></g></svg>