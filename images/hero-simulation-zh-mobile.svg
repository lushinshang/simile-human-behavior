<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
<title id="title">先模擬，再回到真人驗證</title><desc id="desc">以真人資料建立模擬，設定情境方案，與真人觀察比較並更新。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e35"/></marker></defs>
<rect width="720" height="1280" rx="0" fill="#f3f1e9"/>
<g font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><text font-family="'Songti TC','Noto Serif TC',serif" x="48" y="82" fill="#20352c" font-size="38" font-weight="750" text-anchor="start">先模擬，再回到真人驗證</text><text x="48" y="132" fill="#626a5f" font-size="28" font-weight="500" text-anchor="start">人類行為研究的概念流程</text><rect x="66" y="190" width="588" height="160" rx="2" fill="#fcfaf4" stroke="#d5d7c9" stroke-width="2"/><text x="100" y="254" fill="#20352c" font-size="38" font-weight="700" text-anchor="start">真人資料</text><text x="100" y="303" fill="#626a5f" font-size="31" font-weight="500" text-anchor="start">訪談與行為</text><path d="M 360 359 V 398" fill="none" stroke="#526e35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="66" y="410" width="588" height="160" rx="2" fill="#fcfaf4" stroke="#d5d7c9" stroke-width="2"/><text x="100" y="474" fill="#20352c" font-size="38" font-weight="700" text-anchor="start">個體與群體模擬</text><text x="100" y="523" fill="#626a5f" font-size="31" font-weight="500" text-anchor="start">保留差異</text><path d="M 360 579 V 618" fill="none" stroke="#526e35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="66" y="630" width="588" height="160" rx="2" fill="#fcfaf4" stroke="#d5d7c9" stroke-width="2"/><text x="100" y="694" fill="#20352c" font-size="38" font-weight="700" text-anchor="start">情境與方案</text><text x="100" y="743" fill="#626a5f" font-size="31" font-weight="500" text-anchor="start">人、環境、選項</text><path d="M 360 799 V 838" fill="none" stroke="#526e35" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="66" y="850" width="588" height="160" rx="2" fill="#e3e8d7" stroke="#d5d7c9" stroke-width="2"/><text x="100" y="914" fill="#20352c" font-size="38" font-weight="700" text-anchor="start">真人驗證</text><text x="100" y="963" fill="#626a5f" font-size="31" font-weight="500" text-anchor="start">比較預測與觀察</text><text x="360" y="1130" fill="#526e35" font-size="32" font-weight="700" text-anchor="middle">更新資料與問題</text><text x="360" y="1210" fill="#626a5f" font-size="25" font-weight="500" text-anchor="middle">概念歸納，非未公開產品架構</text></g></svg>