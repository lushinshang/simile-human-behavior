<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">85% 的分母是什麼？</title><desc id="desc">68.85% 與 81.25% 是原始平均值；正規化平均約 0.85。不可解讀為所有決策的準確率。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526e35"/></marker></defs>
<rect width="1440" height="810" rx="0" fill="#f3f1e9"/>
<g font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><text font-family="'Songti TC','Noto Serif TC',serif" x="70" y="88" fill="#20352c" font-size="54" font-weight="750" text-anchor="start">85% 的分母是什麼？</text><text x="70" y="145" fill="#626a5f" font-size="30" font-weight="500" text-anchor="start">2024 年論文 v1：GSS 結果</text><text x="72" y="245" fill="#20352c" font-size="31" font-weight="500" text-anchor="start">模型與本人答案相同</text><text x="1368" y="245" fill="#526e35" font-size="43" font-weight="750" text-anchor="end">平均 68.85%</text><rect x="72" y="278" width="1296" height="32" rx="16" fill="#dfe2d6" stroke="#dfe2d6" stroke-width="2"/><rect x="72" y="278" width="892.296" height="32" rx="16" fill="#526e35" stroke="#526e35" stroke-width="2"/><text x="72" y="382" fill="#20352c" font-size="31" font-weight="500" text-anchor="start">本人兩週後重答一致</text><text x="1368" y="382" fill="#5c6e68" font-size="43" font-weight="750" text-anchor="end">平均 81.25%</text><rect x="72" y="415" width="1296" height="32" rx="16" fill="#dfe2d6" stroke="#dfe2d6" stroke-width="2"/><rect x="72" y="415" width="1053.0" height="32" rx="16" fill="#5c6e68" stroke="#5c6e68" stroke-width="2"/><rect x="72" y="500" width="1296" height="138" rx="2" fill="#e3e8d7" stroke="#d5d7c9" stroke-width="2"/><text x="106" y="547" fill="#20352c" font-size="30" font-weight="500" text-anchor="start">相對於本人重測表現</text><text x="106" y="602" fill="#526e35" font-size="39" font-weight="750" text-anchor="start">正規化平均約 0.85</text><text x="1325" y="552" fill="#20352c" font-size="35" font-weight="700" text-anchor="end">68.85 ÷ 81.25 ≈ 0.85</text><text x="1325" y="602" fill="#626a5f" font-size="27" font-weight="500" text-anchor="end">上式僅用整體平均數示意</text><text x="72" y="696" fill="#626a5f" font-size="27" font-weight="500" text-anchor="start">論文先按個人正規化，再彙整</text><text x="1368" y="751" fill="#98452c" font-size="32" font-weight="700" text-anchor="end">不是通用決策命中率</text></g></svg>