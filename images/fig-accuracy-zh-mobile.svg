text-anchor="middle">論文先按個人正規化，再彙整</text><rect x="48" y="1090" width="624" height="100" rx="2" fill="#f1e3d4" stroke="#d4b99e" stroke-width="2"/><text x="360" y="1153" fill="#98452c" font-size="34" font-weight="700" text-anchor="middle">不是通用決策命中率</text></g></svg>